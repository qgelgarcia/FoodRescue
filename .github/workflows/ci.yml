name: FoodRescue CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foodrescue-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: FoodRescue quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out proposed code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Reject unresolved conflict markers
        run: npm run check:conflicts
      - name: Install locked dependencies
        run: npm ci
      - name: Run regression tests
        run: npm test
      - name: Build shared types, frontend and backend
        run: npm run build
